plugins {
  id "com.diffplug.spotless" version "8.4.0"
}

spotless {
  java {
    target "src/**/*.java", "buildSrc/src/**/*.java"
    eclipse("4.37").configFile("eclipse-compact.xml")
    removeUnusedImports()
    formatAnnotations()
    trimTrailingWhitespace()
    endWithNewline()
  }
  format "gradle", {
    target "*.gradle", "**/*.gradle"
    targetExclude "**/build/**"
    leadingTabsToSpaces(2)
    trimTrailingWhitespace()
    endWithNewline()
  }
}

tasks.register("verifyPathingControlPurity") {
  def scanned = files(fileTree("src/main/java/baritone/pathing") {
    include "**/*.java"
    exclude "control/ControlArbiter.java"
  }, file("src/main/java/baritone/behavior/PathingBehavior.java"))

  inputs.files(scanned)
  inputs.files(fileTree("src") { include "**/*.java" })

  doLast {
    def forbidden = [
      "getInputOverrideHandler(",
      "getInputOverrideHandler().",
      "updateTarget(",
      "processRightClick(",
      "processRightClickBlock(",
      ".attack(",
      ".stopRiding(",
      "boat.setInput(",
      ".setSelectedSlot("
    ]
    def offenders = []
    scanned.files.each { f ->
      f.readLines("UTF-8").eachWithIndex { line, idx ->
        forbidden.each { needle ->
          if (line.contains(needle)) {
            offenders << "${f}:${idx + 1}: ${needle}: ${line.trim()}"
          }
        }
      }
    }
    def deletedStateType = "Movement" + "State"
    def deletedWaterType = "MovementWater" + "Line"
    fileTree("src") { include "**/*.java" }.files.each { f ->
      def text = f.getText("UTF-8")
      if (text.contains(deletedStateType)) {
        offenders << "${f}: references deleted ${deletedStateType}"
      }
      if (text.contains(deletedWaterType)) {
        offenders << "${f}: references deleted ${deletedWaterType}"
      }
    }
    fileTree("src/main/java/baritone/pathing/macro") { include "**/*.java" }.files.each { f ->
      if (f.getText("UTF-8").contains("SurfaceWaterDomain")) {
        offenders << "${f}: macro routes must not use legacy SurfaceWaterDomain overlays"
      }
    }
    if (!offenders.isEmpty()) {
      throw new GradleException("Pathing control purity violations:\n" + offenders.join("\n"))
    }
  }
}

allprojects {
  apply plugin: 'java'
  apply plugin: "xyz.wagyourtail.unimined"
  apply plugin: "maven-publish"

  base {
    archivesName.set(rootProject.archives_base_name)
  }

  version = rootProject.mod_version
  group = rootProject.maven_group

  java {
    sourceCompatibility = JavaVersion.toVersion(project.java_release)
    targetCompatibility = JavaVersion.toVersion(project.java_release)

    toolchain {
      languageVersion.set(JavaLanguageVersion.of(project.java_toolchain_version.toInteger()))
    }
  }

  repositories {
    maven {
      name = 'spongepowered-repo'
      url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
      name = 'fabric-maven'
      url = 'https://maven.fabricmc.net/'
    }
    maven {
      name = 'impactdevelopment-repo'
      url = 'https://impactdevelopment.github.io/maven/'
    }
    maven {
      name = "ldtteam"
      url = "https://maven.parchmentmc.net/"
    }
    mavenCentral()
    maven {
      name = 'babbaj-repo'
      url = 'https://babbaj.github.io/maven/'
    }
    maven {
      name = 'xaero-repo'
      url = 'https://chocolateminecraft.com/maven/'
    }
  }

  dependencies {
    compileOnly "org.spongepowered:mixin:${project.mixin_version}"
    compileOnly "org.ow2.asm:asm:${project.asm_version}"
    compileOnly "org.ow2.asm:asm-tree:${project.asm_version}"

    implementation "dev.babbaj:nether-pathfinder:${project.nether_pathfinder_version}"

    implementation 'com.google.code.findbugs:jsr305:3.0.2'
  }

  unimined.minecraft(sourceSets.main, true) {
    version rootProject.minecraft_version

    mappings {
      devNamespace "official"
    }
  }

  tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"

    def targetVersion = project.java_release.toInteger()
    if (JavaVersion.current().isJava9Compatible()) {
      it.options.release = targetVersion
    }
  }
}

unimined.minecraft {
  runs.off = true
  defaultRemapJar = false
}

base {
  archivesName.set("${archives_base_name}-common")
}

sourceSets {
  api {
    compileClasspath += main.compileClasspath
    runtimeClasspath += main.runtimeClasspath
  }
  main {
    compileClasspath += api.output
    runtimeClasspath += api.output
  }
  test {
    compileClasspath += main.compileClasspath + main.runtimeClasspath + main.output
    runtimeClasspath += main.compileClasspath + main.runtimeClasspath + main.output
  }
  launch {
    compileClasspath += main.compileClasspath + main.runtimeClasspath + main.output
    runtimeClasspath += main.compileClasspath + main.runtimeClasspath + main.output
  }
}

dependencies {
  launchCompileOnly "xaero.map:xaeroworldmap-fabric-${project.minecraft_version}:1.40.16"
  launchCompileOnly "xaero.lib:xaerolib-fabric-${project.minecraft_version}:1.1.15"

  testImplementation 'junit:junit:4.13.2'
}

jar {
  from sourceSets.main.output, sourceSets.launch.output, sourceSets.api.output
}

javadoc {
  options.addStringOption('Xwerror', '-quiet') // makes the build fail on travis when there is a javadoc error
  options.linkSource true
  options.encoding "UTF-8" // allow emoji in comments :^)
  source = sourceSets.api.allJava
  classpath += sourceSets.api.compileClasspath
}

tasks.named("check") {
  dependsOn tasks.named("verifyPathingControlPurity")
}
