import baritone.gradle.task.CreateDistTask
import baritone.gradle.task.ProguardTask

plugins {
  id "com.gradleup.shadow" version "9.4.1"
}

base {
  archivesName.set("${rootProject.archives_base_name}-fabric")
}

unimined.minecraft {
  fabric {
    loader project.fabric_version
  }
}

def playtestRoot = rootProject.file("run/playtest")
def minecraftClientRuntimeJar = providers.provider {
  rootProject.file("${gradle.gradleUserHomeDir}/caches/unimined/net/minecraft/minecraft/${rootProject.minecraft_version}/minecraft-${rootProject.minecraft_version}-client.jar")
}

tasks.matching { it.name in ["runClient", "runServer"] }.configureEach {
  javaVersion = JavaVersion.toVersion(rootProject.java_toolchain_version)
  classpath += files(minecraftClientRuntimeJar)
}

tasks.register("runPlaytestClient") {
  group = "Unimined_runs"
  description = "Minecraft Client with the Baritone playtest harness enabled"
  dependsOn tasks.named("runClient")
}

tasks.register("runPlaytestServer") {
  group = "Unimined_runs"
  description = "Minecraft Server for the Baritone playtest harness"
  dependsOn tasks.named("runServer")
}

gradle.taskGraph.whenReady { graph ->
  boolean playtestClient = graph.hasTask(tasks.named("runPlaytestClient").get())
  boolean playtestServer = graph.hasTask(tasks.named("runPlaytestServer").get())
  if (playtestClient) {
    tasks.named("runClient").configure { run ->
      run.workingDir = file(findProperty("baritonePlaytestClientDir") ?: new File(playtestRoot, "client"))
      run.systemProperty "baritone.playtest.enabled", "true"
      run.systemProperty "baritone.playtest.inbox", findProperty("baritonePlaytestInbox") ?: new File(playtestRoot, "inbox").absolutePath
      run.systemProperty "baritone.playtest.results", findProperty("baritonePlaytestResults") ?: new File(playtestRoot, "results").absolutePath
      run.systemProperty "baritone.playtest.server", findProperty("baritonePlaytestServer") ?: "127.0.0.1:25565"
      run.systemProperty "baritone.playtest.quitOnFinish", findProperty("baritonePlaytestQuitOnFinish") ?: "false"
      run.systemProperty "baritone.playtest.codeStamp", findProperty("baritonePlaytestCodeStamp") ?: "unstamped"
      def mountTuning = findProperty("baritoneMountTuning") ?: System.getenv("BARITONE_MOUNT_TUNING")
      if (mountTuning != null && mountTuning.toString().trim()) {
        run.systemProperty "baritone.mountTuning", mountTuning.toString()
      }
      run.setProperty("auth_player_name") { (findProperty("baritonePlaytestUsername") ?: "BaritoneTest").toString() }
      run.setProperty("auth_uuid") { (findProperty("baritonePlaytestUuid") ?: "8b53c6c6-93e4-3df0-8b0c-415e38e60014").toString() }
      run.setProperty("auth_access_token") { "0" }
      run.setProperty("auth_xuid") { "" }
      run.args "--width", "854", "--height", "480"
    }
  }
  if (playtestServer) {
    tasks.named("runServer").configure {
      workingDir = file(findProperty("baritonePlaytestServerDir") ?: new File(playtestRoot, "server"))
      systemProperty "baritone.physics.enabled", findProperty("baritonePhysicsEnabled") ?: "true"
      systemProperty "baritone.physics.inbox", findProperty("baritonePhysicsInbox") ?: new File(playtestRoot, "physics-inbox").absolutePath
      systemProperty "baritone.physics.results", findProperty("baritonePhysicsResults") ?: new File(playtestRoot, "physics-results").absolutePath
    }
  }
}

configurations {
  common
  shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
  compileClasspath.extendsFrom common
  runtimeClasspath.extendsFrom common
}

dependencies {
  // because of multiple sourcesets `common project(":")` doesn't work
  for (sourceSet in rootProject.sourceSets) {
    if (sourceSet == rootProject.sourceSets.test) continue
    common sourceSet.output
    shadowCommon sourceSet.output
  }
  include "dev.babbaj:nether-pathfinder:${project.nether_pathfinder_version}"
}

processResources {
  inputs.property "version", project.version
  inputs.property "minecraft_version", rootProject.minecraft_version
  inputs.property "fabric_version", rootProject.fabric_version
  inputs.property "java_release", rootProject.java_release

  filesMatching("fabric.mod.json") {
    expand(
        "version": project.version,
        "minecraft_version": rootProject.minecraft_version,
        "fabric_version": rootProject.fabric_version,
        "java_release": rootProject.java_release
    )
  }
}

shadowJar {
  configurations = [project.configurations.shadowCommon]
  archiveClassifier.set "dev-shadow"
}

remapJar {
  inputFile.set shadowJar.archiveFile
  dependsOn shadowJar
  archiveClassifier.set null
}

jar {
  archiveClassifier.set "dev"
}

components.java {
  withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
    skip()
  }
}

task proguard(type: ProguardTask) {
  proguardVersion "7.9.1"
  compType "fabric"
}

task createDist(type: CreateDistTask, dependsOn: proguard) {
  compType "fabric"
}

build.finalizedBy(createDist)

publishing {
  publications {
    mavenFabric(MavenPublication) {
      artifactId = rootProject.archives_base_name + "-" + project.name
      from components.java
    }
  }

  // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
  repositories {
    // Add repositories to publish to here.
  }
}
